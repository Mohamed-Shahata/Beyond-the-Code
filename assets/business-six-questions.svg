<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="450" fill="#0f172a"/>
  <text x="450" y="34" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">Six questions to understand any Business</text>

  <rect x="40" y="60" width="270" height="170" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="175" y="92" fill="#dbeafe" font-size="16" font-weight="bold" text-anchor="middle">1. Customer and User</text>
  <text x="175" y="122" fill="#bfdbfe" font-size="13" text-anchor="middle">Who pays? Who uses it?</text>
  <text x="175" y="165" fill="#93c5fd" font-size="12" text-anchor="middle">E-commerce example:</text>
  <text x="175" y="188" fill="#dbeafe" font-size="13" text-anchor="middle">Shopper, Admin, Delivery team</text>

  <rect x="315" y="60" width="270" height="170" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="450" y="92" fill="#dcfce7" font-size="16" font-weight="bold" text-anchor="middle">2. Value</text>
  <text x="450" y="122" fill="#bbf7d0" font-size="13" text-anchor="middle">What problem do we solve?</text>
  <text x="450" y="165" fill="#86efac" font-size="12" text-anchor="middle">E-commerce example:</text>
  <text x="450" y="188" fill="#dcfce7" font-size="13" text-anchor="middle">Buy from home, no store visit</text>

  <rect x="590" y="60" width="270" height="170" rx="12" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="725" y="92" fill="#ffedd5" font-size="16" font-weight="bold" text-anchor="middle">3. Money</text>
  <text x="725" y="122" fill="#fed7aa" font-size="13" text-anchor="middle">How does money move?</text>
  <text x="725" y="165" fill="#fdba74" font-size="12" text-anchor="middle">E-commerce example:</text>
  <text x="725" y="188" fill="#ffedd5" font-size="13" text-anchor="middle">Customer pays, gateway takes a fee</text>

  <rect x="40" y="250" width="270" height="170" rx="12" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
  <text x="175" y="282" fill="#ede9fe" font-size="16" font-weight="bold" text-anchor="middle">4. Core Process</text>
  <text x="175" y="312" fill="#ddd6fe" font-size="13" text-anchor="middle">What are the main operations?</text>
  <text x="175" y="355" fill="#c4b5fd" font-size="12" text-anchor="middle">E-commerce example:</text>
  <text x="175" y="378" fill="#ede9fe" font-size="13" text-anchor="middle">Browse, Cart, Order, Pay, Ship</text>

  <rect x="315" y="250" width="270" height="170" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="450" y="282" fill="#ccfbf1" font-size="16" font-weight="bold" text-anchor="middle">5. Rules</text>
  <text x="450" y="312" fill="#99f6e4" font-size="13" text-anchor="middle">Which policies govern them?</text>
  <text x="450" y="355" fill="#5eead4" font-size="12" text-anchor="middle">E-commerce example:</text>
  <text x="450" y="378" fill="#ccfbf1" font-size="13" text-anchor="middle">Cancel only before shipping</text>

  <rect x="590" y="250" width="270" height="170" rx="12" fill="#831843" stroke="#f472b6" stroke-width="2"/>
  <text x="725" y="282" fill="#fce7f3" font-size="16" font-weight="bold" text-anchor="middle">6. External Parties</text>
  <text x="725" y="312" fill="#fbcfe8" font-size="13" text-anchor="middle">Who else is involved?</text>
  <text x="725" y="355" fill="#f9a8d4" font-size="12" text-anchor="middle">E-commerce example:</text>
  <text x="725" y="378" fill="#fce7f3" font-size="13" text-anchor="middle">Payment Gateway, Shipping company</text>
</svg>
