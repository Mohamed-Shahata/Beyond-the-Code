  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <g font-size="13" text-anchor="middle" fill="#e2e8f0">
    <rect x="15" y="80" width="105" height="60" rx="10" fill="#334155"/><text x="67" y="115">Idea</text>
    <rect x="140" y="80" width="105" height="60" rx="10" fill="#334155"/><text x="192" y="115">Gathering</text>
    <rect x="265" y="70" width="120" height="80" rx="10" fill="#0ea5e9"/><text x="325" y="105" font-weight="bold">SRS</text><text x="325" y="125" font-size="11">(WHAT)</text>
    <rect x="405" y="80" width="105" height="60" rx="10" fill="#334155"/><text x="457" y="115">Design</text>
