<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="340" fill="#0f172a"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <text x="450" y="34" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">How money and goods move in an E-commerce order</text>

  <g font-size="15" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
    <rect x="40" y="80" width="170" height="60" rx="10" fill="#1e3a8a"/><text x="125" y="116">Customer</text>
    <rect x="365" y="80" width="170" height="60" rx="10" fill="#7c2d12"/><text x="450" y="116">Payment Gateway</text>
    <rect x="690" y="80" width="170" height="60" rx="10" fill="#14532d"/><text x="775" y="116">Store</text>
    <rect x="365" y="240" width="170" height="60" rx="10" fill="#4c1d95"/><text x="450" y="276">Shipping Provider</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="210" y1="110" x2="363" y2="110"/>
    <line x1="535" y1="110" x2="688" y2="110"/>
    <line x1="775" y1="140" x2="537" y2="255"/>
    <line x1="365" y1="270" x2="125" y2="142"/>
  </g>

  <g font-size="12" fill="#cbd5e1">
    <text x="286" y="98" text-anchor="middle">Pays online</text>
    <text x="612" y="98" text-anchor="middle">Settles minus fee</text>
    <text x="640" y="196" text-anchor="end">Hands over the parcel</text>
    <text x="60" y="222">Delivers</text>
    <text x="60" y="238">(COD: collects cash)</text>
  </g>

  <text x="450" y="326" fill="#94a3b8" font-size="12" text-anchor="middle">Fees and settlement time depend on the provider and the contract.</text>
</svg>
