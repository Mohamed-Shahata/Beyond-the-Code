<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="430" fill="#0f172a"/>
  <text x="450" y="34" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">Stakeholder vs Actor</text>
  <circle cx="360" cy="210" r="150" fill="#4c1d95" fill-opacity="0.55" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="540" cy="210" r="150" fill="#064e3b" fill-opacity="0.55" stroke="#34d399" stroke-width="2"/>
  <text x="285" y="110" fill="#ddd6fe" font-size="16" font-weight="bold" text-anchor="middle">Stakeholders</text>
  <text x="615" y="110" fill="#a7f3d0" font-size="16" font-weight="bold" text-anchor="middle">Actors</text>
  <g fill="#f1f5f9" font-size="13" text-anchor="middle">
    <text x="295" y="180">Business Owner</text>
    <text x="295" y="210">Accounting Team</text>
    <text x="295" y="240">Product Manager</text>
    <text x="450" y="195" font-weight="bold">Customer</text>
    <text x="450" y="225" font-weight="bold">Admin</text>
    <text x="605" y="195">Payment Gateway</text>
    <text x="605" y="225">Shipping API</text>
  </g>
  <text x="450" y="405" fill="#94a3b8" font-size="13" text-anchor="middle">Overlap = people who care about the system AND use it.</text>
  <text x="450" y="425" fill="#94a3b8" font-size="13" text-anchor="middle">Not every stakeholder is an actor.</text>
</svg>
